name: Update SNI Domain List

on:
  schedule:
    # Run every Monday at 00:00 UTC (08:00 Beijing time)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      max_domains:
        description: 'Max domains to test'
        required: false
        default: '500'
        type: string

jobs:
  update-sni:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run SNI domain fetcher
        id: fetch
        run: |
          python scripts/fetch-sni-domains.py \
            --max-domains ${{ inputs.max_domains || '500' }} \
            --threads 30 \
            --output sni.txt \
            --verbose

      - name: Count domains
        id: count
        run: |
          lines=$(wc -l < sni.txt)
          echo "Compatible domains: $lines"
          echo "domain_count=$lines" >> $GITHUB_OUTPUT

      - name: Create or update PR
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(sni): update domain list'
          title: 'chore(sni): Update SNI domain list'
          body: |
            ## SNI Domain List Update

            Auto-generated SNI domain list update.

            **Domains found:** ${{ steps.count.outputs.domain_count }}

            This PR was triggered manually.
          branch: chore/update-sni-list
          delete-branch: true
          add-paths: |
            sni.txt

      - name: Get current date for release
        id: date
        run: |
          date=$(date +%Y-%m-%d)
          echo "release_date=$date" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sni-${{ steps.date.outputs.release_date }}
          name: SNI Domain List ${{ steps.date.outputs.release_date }}
          body: |
            ## SNI Domain List

            Auto-generated SNI domain list updated on ${{ steps.date.outputs.release_date }}.

            **Compatible domains:** ${{ steps.count.outputs.domain_count }}

            These domains support TLS 1.3 with ALPN h2 (required for Reality protocol).

            ### Usage
            Replace `/usr/share/mimic-node/sni.txt` with the attached file.

            ```bash
            # After updating
            sudo mimictl sni --file /path/to/sni.txt
            ```
          files: sni.txt
          draft: false
          prerelease: false

      - name: Upload release artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sni-domains-${{ steps.date.outputs.release_date }}
          path: sni.txt
          retention-days: 30

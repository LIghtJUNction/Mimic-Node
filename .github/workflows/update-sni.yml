name: Update SNI Domain List

on:
  schedule:
    # Run every Monday at 00:00 UTC (08:00 Beijing time)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      max_domains:
        description: 'Max domains to test'
        required: false
        default: '500'
        type: string

env:
  REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

jobs:
  update-sni:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SNI domain fetcher
        id: fetch
        run: |
          python scripts/fetch-sni-domains.py \
            --max-domains ${{ inputs.max_domains || '500' }} \
            --threads 30 \
            --valuation-threshold 100 \
            --max-val-domains 200 \
            --output overlay/usr/share/mimic-node/sni.txt

      - name: Check output file
        run: |
          lines=$(wc -l < overlay/usr/share/mimic-node/sni.txt)
          echo "Final domains: $lines"
          echo "domain_count=$lines" >> $GITHUB_OUTPUT
          head -20 overlay/usr/share/mimic-node/sni.txt

      - name: Get current date
        id: date
        run: |
          date=$(date +%Y-%m-%d)
          echo "release_date=$date" >> $GITHUB_OUTPUT

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(sni): update domain list'
          title: 'chore(sni): Update SNI domain list'
          body: |
            ## SNI Domain List Update

            Auto-generated SNI domain list update.

            **Domains found:** ${{ steps.count.outputs.domain_count }}
          branch: chore/update-sni-list
          delete-branch: true
          add-paths: |
            overlay/usr/share/mimic-node/sni.txt

      - name: Create GitHub Release
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sni-${{ steps.date.outputs.release_date }}
          name: SNI Domain List ${{ steps.date.outputs.release_date }}
          body: |
            ## SNI Domain List

            Auto-generated SNI domain list updated on ${{ steps.date.outputs.release_date }}.

            **Compatible domains:** ${{ steps.count.outputs.domain_count }}

            Filtered by: TLS 1.3 + ALPN h2 → Clash proxy rules → HumbleWorth valuation ≥ $100
          files: overlay/usr/share/mimic-node/sni.txt
          draft: false

      - name: Upload release artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: sni-domains-${{ steps.date.outputs.release_date }}
          path: overlay/usr/share/mimic-node/sni.txt
          retention-days: 30

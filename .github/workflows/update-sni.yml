name: Update SNI Domain List

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      max_domains:
        description: Maximum domains to test (1-2000)
        required: false
        default: '500'
        type: string

permissions:
  contents: read

concurrency:
  group: update-sni
  cancel-in-progress: false

jobs:
  update-sni:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch and validate SNI domains
        env:
          MAX_DOMAINS: ${{ inputs.max_domains || '500' }}
        run: |
          python - <<'PY'
          import os
          value = os.environ['MAX_DOMAINS']
          assert value.isdecimal() and 1 <= int(value) <= 2000, 'max_domains must be 1-2000'
          PY
          python scripts/fetch-sni-domains.py \
            --max-domains "$MAX_DOMAINS" --threads 20 \
            --output overlay/usr/share/mimic-node/sni.txt
      - name: Count validated domains
        id: count
        run: |
          lines=$(wc -l < overlay/usr/share/mimic-node/sni.txt)
          test "$lines" -gt 0
          echo "domain_count=$lines" >> "$GITHUB_OUTPUT"
      - name: Create or update SNI review PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore(sni): update domain list'
          title: 'chore(sni): update verified SNI domains'
          body: |
            TLS 1.3 + ALPN h2 checks passed for ${{ steps.count.outputs.domain_count }} domains.
            Review server reachability before applying. Empty fetch results preserve the existing list.
          branch: chore/update-sni-list
          delete-branch: true
          add-paths: overlay/usr/share/mimic-node/sni.txt

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install build and release dependencies
        run: pacman -Syu --noconfirm --needed rust git openssl sing-box python shellcheck github-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate version tag
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Use a vX.Y.Z tag'
          assert tag == 'v' + version, 'Tag does not match Cargo.toml'
          PY
      - name: Test and build as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && bash scripts/check.sh && cargo build --locked --release --all-features"
      - name: Bundle Arch Linux x86_64 release
        run: |
          mkdir -p dist/mimic-node
          cp target/release/mimictl dist/mimic-node/
          cp -r overlay dist/mimic-node/
          cp LICENSE README.md dist/mimic-node/
          tar -C dist -czf "dist/mimic-node-${RELEASE_TAG}-archlinux-x86_64.tar.gz" mimic-node
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Mimic-Node $RELEASE_TAG" --notes-file CHANGELOG.md --draft
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

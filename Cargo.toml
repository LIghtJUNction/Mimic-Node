[package]
name = "mimictl"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "An Arch Linux sing-box node manager with staged OverlayFS configuration"
license = "GPL-3.0-or-later"
repository = "https://github.com/LIghtJUNction/Mimic-Node"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
base64 = "0.23"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = [
  "http2",
  "native-tls",
  "blocking",
  "json",
] }
uuid = { version = "1.19.0", features = ["v4", "fast-rng"] }
rand = "0.10"
regex = "1.12"
colored = "3.0"
hex = "0.4"
x25519-dalek = "2"
url = "2.5"
if-addrs = "0.6"
dirs = "7"

[features]
default = []
completions = ["clap_complete"]
